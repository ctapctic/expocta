<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos & Stands - Expotecnia EFTP</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="css/styles.css">

  
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-cpu-fill fs-3 text-info"></i>
        <span>EXPOTECNIA<span class="text-white">EFTP</span></span>
      </a>
      <div class="d-none ms-lg-3" data-logos-institucionales></div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="proyectos.html"><i class="bi bi-diagram-3 me-1"></i>Proyectos</a></li>
          <li class="nav-item"><a class="nav-link" href="ofertas.html"><i class="bi bi-mortarboard me-1"></i>Oferta EFTP</a></li>
          <li class="nav-item"><a class="nav-link" href="charlas.html"><i class="bi bi-mic me-1"></i>Charlas</a></li>
          <li class="nav-item"><a class="nav-link" href="empresas.html"><i class="bi bi-building me-1"></i>Empresas</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-speedometer2 me-1"></i>Panel Admin</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-info btn-sm rounded-pill" onclick="openQRScannerModal()">
            <i class="bi bi-qr-code-scan me-1"></i>Escanear QR Stand
          </button>
          <button id="user-profile-btn" class="btn btn-primary btn-sm rounded-pill" onclick="showAuthModal()">
            <i class="bi bi-person-circle me-1"></i>Ingresar
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container my-4 flex-grow-1">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
      <div>
        <h2 class="fw-bold mb-1 text-dark"><i class="bi bi-diagram-3-fill text-primary me-2"></i>Catálogo de Proyectos & Stands</h2>
        <p class="text-muted small mb-0">Explora las innovaciones de los alumnos y califica con la rúbrica de 4 ejes.</p>
      </div>
    </div>

    <!-- BARRA DE FILTROS -->
    <div class="card card-body border-0 shadow-sm mb-4 rounded-4 bg-white">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label small fw-bold text-muted">Buscar por Nombre, Stand o Tecnología</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control" placeholder="Ej: STAND-101, IoT, Robótica...">
          </div>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-muted">Filtrar por Especialidad</label>
          <select id="specialty-filter" class="form-select">
            <option value="">Todas las Especialidades</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">Nivel TRL (Maturity)</label>
          <select id="trl-filter" class="form-select">
            <option value="">Todos los TRL (1 a 9)</option>
            <option value="1">TRL 1 - Concepto Inicial</option>
            <option value="5">TRL 5 - Validación en Entorno</option>
            <option value="6">TRL 6 - Prototipo Operativo</option>
            <option value="7">TRL 7 - Demostración en Sistema</option>
          </select>
        </div>
      </div>
    </div>

    <!-- CONTENEDOR DE TARJETAS DE PROYECTOS -->
    <div class="row" id="proyectos-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando proyectos...</p>
      </div>
    </div>
  </main>

  <!-- BOTÓN FLOTANTE QR SCANNER -->
  <button class="fab-qr" onclick="openQRScannerModal()" title="Escanear Código QR de Stand">
    <i class="bi bi-qr-code-scan"></i>
  </button>

  <!-- FOOTER -->
  <footer>
    <div class="container text-center">
      <p class="mb-1 text-white fw-bold">Expotecnia de Educación Formativo-Técnica Profesional (EFTP)</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script src="js/proyectos.js"></script>
</body>
</html>
